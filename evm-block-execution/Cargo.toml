[package]
name = "aurora-evm-block-execution"
authors.workspace = true
edition.workspace = true
version.workspace = true
description = "Aurora EVM block execution library"
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
unreadable_literal = "allow"
similar_names = "allow"
too_long_first_doc_paragraph = "allow"

[dependencies]
aurora-evm = { workspace = true, features = ["with-serde"] }
aurora-engine-precompiles.workspace = true
c-kzg = "1.0"
hash-db = "0.15"
hex-literal.workspace = true
primitive-types = { workspace = true, features = ["rlp", "serde", "std"] }
plain_hasher = "0.2"
rlp = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
sha3.workspace = true
triehash = "0.8"

[dev-dependencies]
hex = "0.4"
serde_json = "1.0"

[features]
