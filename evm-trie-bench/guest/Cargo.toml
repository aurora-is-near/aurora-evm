[package]
name = "aurora-evm-trie-guest"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aurora-evm-trie-bench = { path = "..", default-features = false }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }

[features]
tiny = ["aurora-evm-trie-bench/tiny"]

[patch.crates-io]
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", rev = "8fcc866dc94dcec3e79c3b2bc8fbc51b22f2d5e1" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
