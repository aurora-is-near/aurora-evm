[package]
name = "aurora-evm-trie-guest"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aurora-evm-trie-bench = { path = "..", default-features = false }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
# Match zeth's guest-only portability patches, not substitutes for precompile execution.
blst = { version = "=0.3.16", optional = true }
c-kzg = { version = "=2.1.7", optional = true }

[features]
tiny = ["aurora-evm-trie-bench/tiny"]
block = ["aurora-evm-trie-bench/block", "dep:blst", "dep:c-kzg"]

[[bin]]
name = "block"
required-features = ["block"]

[patch.crates-io]
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
c-kzg = { git = "https://github.com/risc0/c-kzg-4844", tag = "v2.1.7-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", rev = "8fcc866dc94dcec3e79c3b2bc8fbc51b22f2d5e1" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Line tables for the sampling profiler; they do not change the executed instructions.
debug = 1
