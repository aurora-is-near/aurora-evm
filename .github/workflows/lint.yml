name: Build & Lint

on:
  push:
    branches: [ master ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Clippy no_std
        run: cargo clippy --no-default-features
      - name: Clippy with features
        run: cargo clippy --features tracing,create-fixed,with-serde
      - name: Clippy with features for aurora-evm-jsontests
        run: cargo clippy -p aurora-evm-jsontests --features dump-state

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build aurora-evm
        run: cargo build -p aurora-evm

      - name: Build aurora-evm no-std
        run: cargo build -p aurora-evm --no-default-features

      - name: Build aurora-evm with features (tracing + create-fixed + with-serde)
        run: cargo build -p aurora-evm --features tracing,create-fixed,with-serde

      - name: Build aurora-evm-block-execution
        run: cargo build -p aurora-evm-block-execution
