[package]
name = "aurora-evm-jsontests"
version.workspace = true
license = "MIT"
authors.workspace = true
description = "Aurora EVM json tests"
repository.workspace = true
keywords.workspace = true
edition.workspace = true
publish = false

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[dependencies]
aurora-engine-precompiles.workspace = true
aurora-evm = { workspace = true, features = ["with-serde"] }
bytecount = "0.6"
clap = { version = "4.5", features = ["cargo"] }
c-kzg = "1.0"
derive_more = { version = "2", features = ["full"] }
ethereum = "0.18"
hex.workspace = true
hex-literal.workspace = true
libsecp256k1.workspace = true
primitive-types = { workspace = true, features = ["serde"] }
rlp.workspace = true
sha2.workspace = true
sha3.workspace = true
serde.workspace = true
serde_json = "1.0"

[features]
enable-slow-tests = []
print-debug = ["aurora-evm/print-debug"]
dump-state = ["aurora-evm/with-serde"]
