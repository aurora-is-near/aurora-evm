[package]
name = "aurora-evm-trie"
authors.workspace = true
edition.workspace = true
version.workspace = true
description = "Ethereum ordered Merkle-Patricia roots and sparse witness tries"
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rlp = { workspace = true, features = ["std"] }
sha3.workspace = true
tiny-keccak = { workspace = true, optional = true }

[features]
default = []
# zkEVM guests may patch tiny-keccak with their VM's accelerated implementation.
tiny-keccak = ["dep:tiny-keccak"]
# Reference trie builder for tests of dependants (not part of the production surface).
test-utils = []

[dev-dependencies]
hex.workspace = true
hash-db.workspace = true
plain_hasher.workspace = true
triehash.workspace = true
